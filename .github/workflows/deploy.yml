# ─────────────────────────────────────────────────────────────────────────────
# DEPLOY — scaffold, aún NO operativo. Se activa cuando creemos el proyecto.
#
# Asume Cloudflare Pages (mismo ecosistema que v1.ismaelhv.com). Si el host final
# es otro (Vercel, Netlify, VPS, GitHub Pages), avísame y cambio este archivo.
#
# Antes de que funcione hace falta, en GitHub → Settings → Secrets and variables:
#   - CLOUDFLARE_API_TOKEN   (token con permiso "Cloudflare Pages: Edit")
#   - CLOUDFLARE_ACCOUNT_ID
# y reemplazar CHANGE_ME por el nombre del proyecto de Pages que creemos.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=CHANGE_ME
