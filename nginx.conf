server {
  listen 80;
  listen [::]:80;
  server_name _;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  # Assets con hash de Astro — cache larga e inmutable
  location /_astro/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Otros estáticos versionables — cache larga
  location ~* \.(?:css|js|svg|gif|png|jpg|jpeg|ico|woff2?|eot|ttf|otf|webp|mp4|webm)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Páginas HTML (y todo lo demás, incluidos los PDF del CV) — sin cache,
  # para que los redeploys se vean al instante.
  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
